name: tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.4'
                  tools: composer:v2
                  coverage: pcov
                  ini-values: zend.assertions=1

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
                  cache: npm

            -   name: Cache Composer Dependencies
                uses: actions/cache@v6
                with:
                    path: vendor
                    key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-composer-

            - name: Install Composer Dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

            - name: Copy Environment File
              run: cp .env.example .env

            - name: Generate Application Key
              run: php artisan key:generate

            - name: Install Node Dependencies
              run: npm ci

            - name: Build Assets
              run: npm run build

            - name: Get Playwright version
              id: playwright-version
              run: |
                  echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright Browsers
              uses: actions/cache@v6
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright Browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps

            - name: Install Playwright System Dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps

            - name: Cache Rector
              uses: actions/cache@v6
              with:
                  path: /tmp/rector
                  key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-rector-

            - name: Cache PHPStan
              uses: actions/cache@v6
              with:
                  path: /tmp/phpstan
                  key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-phpstan-

            - name: Create Cache Directories
              run: mkdir -p /tmp/rector /tmp/phpstan

            - name: Run CI Checks
              run: composer ci:check

            - name: Tests
              run: composer test

            - name: Store Artifacts
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: browser-screenshots
                  path: tests/Browser/Screenshots
